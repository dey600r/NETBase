nameOverride: ""

# DEPLOYMENT CONFIG
deployment:
  replicas: 1
  labels:
    runtime: sso
  image:
    repository: image-registry.openshift-image-registry.svc:5000
  env:
    - name: KC_PROXY
      value: edge
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: admin
  args:
    - start
    - '--proxy-headers=xforwarded'
    - '--hostname-strict=false'
    - '--http-enabled=true'
    - '--http-port=8180'
  strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 25%
        maxSurge: 25%
  policy: Always
  securityContext:
    privileged: false

# IMAGE STREAM
imageStream:
  tag: latest
  from:
    kind: DockerImage
    name: quay.io/keycloak/keycloak:latest
  importPolicy: Legacy
  referencePolicy: Local

# SERVICE
service:
  ports:
    - name: keycloak-tcp
      protocol: TCP
      port: 8180
      targetPort: 8180
    - name: 8443-tcp
      protocol: TCP
      port: 8443
      targetPort: 8443
    

#ROUTE
route:
  enabled: true
  domain: "apps-crc.testing"
  tls:
    termination: edge

#PERSISTANCE CLAIM
persistenceClaim:
  enabled: true
  name: keycloak-path
  dir:
    persistentVolumeClaim:
      claimName: pvc-database
  mountPaths:
    - /opt/keycloak/data
