{{- if or .Values.secret.enabled .Values.buildSecret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: secret-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- if .Values.secret.enabled}}
{{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- if .Values.buildSecret.enabled}}
{{- range $key, $value := .Values.buildSecret.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}